<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TrackLine Circuit Globe</title>
<style>
  :root {
    --bg: #000;
    --panel: rgba(10, 10, 10, 0.9);
    --border: rgba(255, 255, 255, 0.14);
    --text: #fff;
    --muted: #9a9a9a;
    --header-h: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }

  header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 5;
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: #000; border-bottom: 1px solid var(--border); }
  header b { font-size: 18px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  header span { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #panel { position: fixed; top: calc(var(--header-h) + 16px); right: 16px; width: 300px; max-height: calc(100% - var(--header-h) - 32px);
    display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  #panel h2 { margin: 0; padding: 12px 14px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 600; }
  #list { overflow-y: auto; }
  .item { padding: 9px 14px; cursor: pointer; border-left: 2px solid transparent; }
  .item:hover { background: rgba(255,255,255,0.06); }
  .item.sel { background: rgba(255,255,255,0.1); border-left-color: #fff; }
  .item b { display: block; font-weight: 600; }
  .item small { color: var(--muted); }

  #card { position: fixed; left: 16px; bottom: 16px; width: 360px; max-width: calc(100vw - 32px); padding: 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: none; }
  #card.show { display: block; }
  #card h3 { margin: 0 28px 2px 0; font-size: 19px; }
  #card .country { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  #card p { margin: 10px 0 16px; color: #ddd; }
  #card .shop { display: block; text-align: center; padding: 12px 16px; border-radius: 6px; background: #fff; color: #000;
    font-weight: 700; text-decoration: none; }
  #card .shop:hover { background: #e2e2e2; }
  #card .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }

  #tip { position: fixed; pointer-events: none; padding: 5px 9px; border-radius: 6px; background: #000;
    border: 1px solid var(--border); font-size: 12px; white-space: nowrap; display: none; transform: translate(12px, -50%); }
  #hint { position: fixed; left: 16px; top: calc(var(--header-h) + 12px); color: var(--muted); font-size: 12px; pointer-events: none; }
  #toggle { display: none; }

  @media (max-width: 760px) {
    header span { font-size: 12px; }
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 50vh; border-radius: 10px 10px 0 0;
      transition: transform .25s ease; }
    #panel.collapsed { transform: translateY(calc(100% - 44px)); }
    #panel h2 { display: none; }
    #toggle { display: block; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--border); color: var(--muted);
      padding: 8px 0; font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #card { bottom: auto; top: calc(var(--header-h) + 36px); }
  }
</style>
</head>
<body>
<div id="scene"></div>

<header>
  <b>TrackLine</b><span>– Wear the world's greatest circuits</span>
</header>
<div id="hint">Drag to spin · scroll to zoom · click a pin</div>

<aside id="panel">
  <button id="toggle" aria-label="Show circuits">Circuits</button>
  <h2>12 circuits</h2>
  <div id="list"></div>
</aside>

<div id="card">
  <button class="close" aria-label="Close">×</button>
  <h3 id="c-name"></h3>
  <div class="country" id="c-country"></div>
  <p id="c-note"></p>
  <a id="c-shop" class="shop" target="_top">Shop the tee – from €32.99</a>
</div>

<div id="tip"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/internmap.min.js"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="tracks.js"></script>
<script>
(() => {
  const R = 1;
  const DEG = Math.PI / 180;
  const tracks = TRACKS.map(([name, country, lat, lon, handle, note], i) => ({ i, name, country, lat, lon, handle, note }));

  // ---------- renderer / scene ----------
  const host = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
  camera.position.copy(latLonToVec(42, 10, innerWidth / innerHeight < 0.75 ? 5 : 3.4));

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 1.15;
  controls.maxDistance = 6;
  controls.rotateSpeed = 0.5;
  controls.zoomSpeed = 0.7;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  scene.add(sun);

  function latLonToVec(lat, lon, r = R) {
    const phi = (90 - lat) * DEG, theta = (lon + 180) * DEG;
    return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
  }

  // ---------- stars ----------
  {
    const g = new THREE.BufferGeometry(), n = 2500, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      v.multiplyScalar(30 + Math.random() * 30);
      pos.set([v.x, v.y, v.z], i * 3);
    }
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.5 })));
  }

  // ---------- globe (monochrome) ----------
  const W = 4096, H = 2048;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0b0b0b"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 2;
  for (let lon = -180; lon <= 180; lon += 15) { const x = (lon + 180) / 360 * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let lat = -75; lat <= 75; lat += 15) { const y = (90 - lat) / 180 * H; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const globe = new THREE.Mesh(
    new THREE.SphereGeometry(R, 96, 96),
    new THREE.MeshPhongMaterial({ map: tex, shininess: 8, specular: 0x222222 })
  );
  scene.add(globe);

  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.1, 64, 64),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vN; void main(){ float i = pow(0.7 - dot(vN, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(1.0,1.0,1.0,1.0) * i * 0.6; }`
    })
  ));

  fetch("vendor/countries-50m.json")
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
      const proj = d3.geoEquirectangular().scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
      const path = d3.geoPath(proj, ctx);
      ctx.beginPath(); path(countries); ctx.fillStyle = "#2a2a2a"; ctx.fill();
      ctx.beginPath(); path(borders); ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); path(countries); ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 2; ctx.stroke();
      tex.needsUpdate = true;
    })
    .catch(() => {});

  // ---------- pins ----------
  const headGeo = new THREE.SphereGeometry(0.011, 16, 16);
  const stemGeo = new THREE.CylinderGeometry(0.0018, 0.0018, 1, 6);
  stemGeo.translate(0, 0.5, 0);
  const hitGeo = new THREE.SphereGeometry(0.028, 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hitTargets = [];
  const UP = new THREE.Vector3(0, 1, 0);
  const HEIGHT = 0.045;

  tracks.forEach(t => {
    const dir = latLonToVec(t.lat, t.lon).normalize();
    const g = new THREE.Group();
    g.position.copy(dir);
    g.quaternion.setFromUnitVectors(UP, dir);
    const stem = new THREE.Mesh(stemGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
    stem.scale.y = HEIGHT;
    const head = new THREE.Mesh(headGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    head.position.y = HEIGHT;
    const hit = new THREE.Mesh(hitGeo, hitMat);
    hit.position.y = HEIGHT;
    hit.userData.track = t;
    g.add(stem, head, hit);
    scene.add(g);
    t.obj = g; t.dir = dir;
    hitTargets.push(hit);
  });

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.02, 0.026, 48),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide, depthWrite: false })
  );
  ring.visible = false;
  scene.add(ring);

  // ---------- UI ----------
  const list = document.getElementById("list");
  const panel = document.getElementById("panel");
  const card = document.getElementById("card");
  const tip = document.getElementById("tip");
  let selected = null;

  tracks.forEach(t => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = "<b></b><small></small>";
    el.querySelector("b").textContent = t.name;
    el.querySelector("small").textContent = t.country;
    el.onclick = () => select(t);
    t.el = el;
    list.appendChild(el);
  });
  document.getElementById("toggle").onclick = () => panel.classList.toggle("collapsed");
  card.querySelector(".close").onclick = () => select(null);
  if (innerWidth <= 760) panel.classList.add("collapsed");

  function select(t) {
    selected = t;
    document.querySelectorAll(".item.sel").forEach(el => el.classList.remove("sel"));
    if (!t) { card.classList.remove("show"); ring.visible = false; return; }
    t.el.classList.add("sel");
    t.el.scrollIntoView({ block: "nearest" });
    document.getElementById("c-name").textContent = t.name;
    document.getElementById("c-country").textContent = t.country;
    document.getElementById("c-note").textContent = t.note;
    document.getElementById("c-shop").href = SHOP_URL + t.handle;
    card.classList.add("show");
    ring.position.copy(t.dir.clone().multiplyScalar(R + 0.001));
    ring.lookAt(t.dir.clone().multiplyScalar(2));
    ring.visible = true;
    if (innerWidth <= 760) panel.classList.add("collapsed");
    flyTo(t.dir);
  }

  // ---------- camera fly-to ----------
  let fly = null;
  function flyTo(dir) {
    controls.autoRotate = false;
    const from = camera.position.clone();
    fly = { from: from.clone().normalize(), to: dir.clone(), r0: from.length(), r1: Math.max(Math.min(from.length(), 2.2), 1.7), t: 0 };
  }
  function stepFly(dt) {
    fly.t = Math.min(1, fly.t + dt / 1.4);
    const e = fly.t < .5 ? 4 * fly.t ** 3 : 1 - Math.pow(-2 * fly.t + 2, 3) / 2;
    const q = new THREE.Quaternion().setFromUnitVectors(fly.from, fly.to);
    const qi = new THREE.Quaternion().slerp(q, e);
    const r = fly.r0 + (fly.r1 - fly.r0) * e + Math.sin(e * Math.PI) * 0.4;
    camera.position.copy(fly.from.clone().applyQuaternion(qi).multiplyScalar(r));
    camera.lookAt(0, 0, 0);
    if (fly.t >= 1) fly = null;
  }

  // ---------- picking ----------
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let downAt = null, hovered = null;
  function pick(x, y) {
    mouse.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(hitTargets);
    if (!hits.length) return null;
    const g = ray.intersectObject(globe)[0];
    if (g && g.distance < hits[0].distance - 0.02) return null; // pin is behind the globe
    return hits[0].object.userData.track;
  }
  renderer.domElement.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const t = pick(e.clientX, e.clientY);
    hovered = t;
    renderer.domElement.style.cursor = t ? "pointer" : "grab";
    if (t) { tip.style.display = "block"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.textContent = `${t.name} — ${t.country}`; }
    else tip.style.display = "none";
  });
  renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; fly = null; controls.autoRotate = false; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const t = pick(e.clientX, e.clientY);
    if (t) select(t);
  });

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---------- loop ----------
  const clock = new THREE.Clock();
  (function loop() {
    const dt = clock.getDelta(), time = clock.elapsedTime;
    if (fly) stepFly(dt); else controls.update();
    sun.position.copy(camera.position).add(new THREE.Vector3(1.5, 1, 0));
    const s = THREE.MathUtils.clamp((camera.position.length() - R) / 1.8, 0.2, 1.3);
    tracks.forEach(t => t.obj.scale.setScalar(s * (t === selected ? 1.7 : t === hovered ? 1.4 : 1)));
    if (ring.visible) {
      const p = (time * 0.8) % 1;
      ring.scale.setScalar(s * (1 + p * 2.2));
      ring.material.opacity = 1 - p;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
